name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Show signing fingerprints
        run: ./gradlew signingReport | tee signing-report.txt

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK and signing report
        uses: actions/upload-artifact@v4
        with:
          name: Tahen-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-report.txt
          retention-days: 14
