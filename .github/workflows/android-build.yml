name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      # 1. بناء الـ APK أولاً لتوليد ملف الـ debug.keystore
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # 2. طباعة الـ SHA1 بعد إنشاء المفتاح
      - name: Show signing fingerprints
        run: gradle :app:signingReport | tee signing-report.txt

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK and signing report
        uses: actions/upload-artifact@v4
        with:
          name: Tahen-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-report.txt
          retention-days: 14
